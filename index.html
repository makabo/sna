<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makabo Files</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      color: #f1f5f9;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
    }
    a {
      display: block;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      text-decoration: none;
      color: #60a5fa;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    a:hover {
      background: #334155;
      border-color: #60a5fa;
    }
  </style>
</head>
<body>
  <h1>Repository Files</h1>
  <ul id="file-list">Loading files...</ul>

  <script>
    const username = "makabo";
    const repo = "files";

    fetch(`https://api.github.com/repos/${username}/${repo}/contents/`)
      .then(res => res.json())
      .then(files => {
        const list = document.getElementById("file-list");
        list.innerHTML = "";
        files.forEach(file => {
          if (file.name !== "index.html" && file.name !== "README.md" && !file.name.startsWith(".")) {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${file.name}">${file.name}</a>`;
            list.appendChild(li);
          }
        });
        if (!list.innerHTML) list.innerHTML = "<li>No files uploaded yet.</li>";
      })
      .catch(() => {
        document.getElementById("file-list").innerHTML = "<li>Error loading files.</li>";
      });
  </script>
</body>
</html>
